name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git tag push to work correctly

      - name: Set Version Environment Variable
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=v0.0.0-test" >> $GITHUB_ENV
          else
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Generate Changelog
        if: startsWith(github.ref, 'refs/tags/v')
        id: generate_changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^)
          if [ -z "$PREV_TAG" ]; then
            echo "::error::Could not find previous release tag"
            exit 1
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "## What's Changed" >> $GITHUB_ENV
          git log "$PREV_TAG"..HEAD^ --pretty=format:"• %s in %h" >> $GITHUB_ENV
          echo -e "\n\nFull Changelog: [$PREV_TAG...${{ env.VERSION }}](https://github.com/${{ github.repository }}/compare/$PREV_TAG...${{ env.VERSION }})" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: ./gradlew assembleRelease
        # gradlew execute permission should be set in the repo via:
        # git update-index --chmod=+x gradlew

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          body: ${{ env.CHANGELOG }}
          files: ${{ steps.sign_apk.outputs.signedReleaseFile }}
          generate_release_notes: true
